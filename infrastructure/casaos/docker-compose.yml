name: cupmemo
# Dormant stock CasaOS candidate. See docs/PRIVATE_COMPOSE.md before validation.
# No default images, production paths, identities or secret values.
x-bounded-service: &bounded-service
  platform: linux/arm64
  pull_policy: never
  restart: 'no'
  cpus: 1
  pids_limit: 128
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

x-node-service: &node-service
  <<: *bounded-service
  user: node
  read_only: true
  tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777']

x-readiness: &readiness
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 30s

services:
  cupmemo-tls:
    <<: *bounded-service
    image: ${CUPMEMO_TLS_IMAGE:?CUPMEMO_TLS_IMAGE must select the reviewed immutable official-base ARM64 Caddy2 derivative}
    user: ${CUPMEMO_TLS_UID:?CUPMEMO_TLS_UID must be an explicitly verified positive numeric UID}
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    read_only: true
    cpus: 0.25
    pids_limit: 64
    mem_limit: 64m
    memswap_limit: 64m
    environment:
      GOMEMLIMIT: 48MiB
      CUPMEMO_TLS_HOSTNAME: ${CUPMEMO_TLS_HOSTNAME:?CUPMEMO_TLS_HOSTNAME must identify this tailnet node}
    tmpfs:
      - /data:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /config:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes:
      - type: bind
        source: ${CUPMEMO_TLS_CONFIG_FILE:?CUPMEMO_TLS_CONFIG_FILE must name the reviewed external Caddyfile}
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CUPMEMO_TLS_CERT_FILE:?CUPMEMO_TLS_CERT_FILE must name the external certificate}
        target: /run/secrets/cupmemo_tls_cert
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CUPMEMO_TLS_KEY_FILE:?CUPMEMO_TLS_KEY_FILE must name the external private key}
        target: /run/secrets/cupmemo_tls_key
        read_only: true
        bind:
          create_host_path: false
    ports:
      - target: 8445
        published: '8445'
        host_ip: ${CUPMEMO_TLS_BIND_IP:?CUPMEMO_TLS_BIND_IP must be this node tailnet IPv4}
        protocol: tcp
    networks: [frontend, private_ingress]
    depends_on:
      cupmemo-web:
        condition: service_healthy
    healthcheck:
      <<: *readiness
      test:
        - CMD-SHELL
        - 'curl --fail --silent --output /dev/null --max-time 3 --noproxy "*" --cacert /run/secrets/cupmemo_tls_cert --resolve "$$CUPMEMO_TLS_HOSTNAME:8445:127.0.0.1" "https://$$CUPMEMO_TLS_HOSTNAME:8445/sign-in"'

  cupmemo-web:
    <<: *node-service
    image: ${CUPMEMO_WEB_IMAGE:?CUPMEMO_WEB_IMAGE must select an immutable ARM64 image}
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3101'
      CUPMEMO_API_ORIGIN: http://cupmemo-api:4101
    networks: [frontend]
    depends_on:
      cupmemo-api:
        condition: service_healthy
    healthcheck:
      <<: *readiness
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3101/sign-in',{signal:AbortSignal.timeout(3000),redirect:'manual'}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"

  cupmemo-api:
    <<: *node-service
    image: ${CUPMEMO_API_IMAGE:?CUPMEMO_API_IMAGE must select an immutable ARM64 image}
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      CUPMEMO_DATABASE_URL_PRODUCTION: ${CUPMEMO_DATABASE_URL_PRODUCTION:?CUPMEMO_DATABASE_URL_PRODUCTION must be explicitly configured}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be explicitly configured}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be explicitly configured}
      NODE_ENV: production
      CUPMEMO_DB_ENV: production
      CUPMEMO_API_HOST: 0.0.0.0
      CUPMEMO_API_PORT: '4101'
    networks: [frontend, backend]
    depends_on:
      cupmemo-postgres:
        condition: service_healthy
    healthcheck:
      <<: *readiness
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4101/ready',{signal:AbortSignal.timeout(3000),redirect:'manual'}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"

  cupmemo-postgres:
    <<: *bounded-service
    image: ${CUPMEMO_POSTGRES_IMAGE:?CUPMEMO_POSTGRES_IMAGE must select the reviewed immutable ARM64 HDD-guarded PG17 image}
    user: ${POSTGRES_DATA_UID:?POSTGRES_DATA_UID must be an explicitly verified positive numeric UID}
    # PROVISIONAL ceiling only: no positive database or Pi capacity acceptance.
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be explicitly configured}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be explicitly configured}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_HDD_UUID: ${POSTGRES_HDD_UUID:?POSTGRES_HDD_UUID must identify the verified ext4 HDD}
      POSTGRES_HDD_MOUNT: ${POSTGRES_HDD_MOUNT:?POSTGRES_HDD_MOUNT must name the verified host mount root}
      POSTGRES_DATA_DIR: ${POSTGRES_DATA_DIR:?POSTGRES_DATA_DIR must name a pre-existing verified HDD-only directory}
      POSTGRES_DATA_UID: ${POSTGRES_DATA_UID:?POSTGRES_DATA_UID must be an explicitly verified positive numeric UID}
    secrets:
      - source: postgres_password
        target: /run/secrets/postgres_password
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:?POSTGRES_DATA_DIR must name a pre-existing verified HDD-only directory}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks: [backend]
    healthcheck:
      <<: *readiness
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']

networks:
  private_ingress:
    driver: bridge
    internal: false
  frontend:
    internal: true
  backend:
    internal: true

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE must name a private external password file}

# Stock CasaOS metadata only; no manager patches or privileged hooks.
# No port_map: there is no published web port or approved dashboard launch URL.
x-casaos:
  id: io.github.ohjy1006kenneth.cupmemo
  main: cupmemo-web
  architectures: [arm64]
  category: Productivity
  developer: CupMemo
  author: CupMemo
  title:
    en_US: CupMemo
  tagline:
    en_US: Personal coffee brewing journal
  description:
    en_US: Private coffee journal. Offline preparation only; live launch remains held.
  version: '0.1.0'
  tips:
    before_install:
      en_US: Do not install/start yet. Review docs/PRIVATE_COMPOSE.md for stock importer compatibility and HDD admission. Keep restart disabled.
